name: Update quotes
on:
  schedule:
    # Trigger every 5 min, Mon-Fri, ~08:30-16:25 IST (03:00-10:55 UTC).
    # Each run loops 3 fetch cycles ~100s apart -> effective ~2 min refresh.
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyotp cryptography
      - name: 3 fetch cycles (~2 min cadence)
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_DASH_PASSPHRASE: ${{ secrets.ANGEL_DASH_PASSPHRASE }}
        timeout-minutes: 9
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          for i in 1 2 3; do
            echo "=== cycle $i $(date -u +%H:%M:%SZ) ==="
            python scripts/fetch_quotes.py || echo "cycle $i fetch failed (transient), continuing"
            git add docs/quotes.json docs/holdings.enc.json 2>/dev/null || git add docs/quotes.json
            if ! git diff --cached --quiet; then
              git commit -m "quotes: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase origin main
              git push
            fi
            if [ "$i" -lt 3 ]; then sleep 100; fi
          done
