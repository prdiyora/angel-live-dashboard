name: Update quotes
on:
  schedule:
    # Mon-Fri, deliberately off-peak minutes and only 2 fires/day: GitHub
    # drops high-frequency (*/5) cron schedules under load, so instead each
    # fire starts ONE long-running job that fetches every ~2 min itself.
    # Kick A: 08:55 IST (03:25 UTC) -> loops until 15:40 IST
    #         (GitHub caps a job at ~6h, so this dies ~14:55 IST)
    # Kick B: 14:50 IST (09:20 UTC) -> covers the tail until 15:40 IST
    - cron: "25 3 * * 1-5"
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyotp cryptography
      - name: Fetch loop (~2 min cadence, stops 15:40 IST)
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_DASH_PASSPHRASE: ${{ secrets.ANGEL_DASH_PASSPHRASE }}
        timeout-minutes: 355
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          while :; do
            now_ist=$(TZ=Asia/Kolkata date +%H%M)
            dow=$(TZ=Asia/Kolkata date +%u)
            if [ "$dow" -gt 5 ] || [ "$now_ist" -ge 1540 ]; then
              echo "session over, stopping"; break
            fi
            echo "=== cycle $(TZ=Asia/Kolkata date '+%H:%M:%S IST') ==="
            python scripts/fetch_quotes.py || echo "fetch failed (transient), continuing"
            git add docs/quotes.json docs/holdings.enc.json 2>/dev/null || git add docs/quotes.json
            if ! git diff --cached --quiet; then
              git commit -m "quotes: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase origin main
              git push
            fi
            sleep 110
          done
